<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DictaFlow — YouTube英語ディクテーション学習</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hero {
      text-align: center;
      padding: 80px 24px 64px;
    }
    .hero-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      display: inline-block;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(91,127,238,0.3);
      overflow: hidden;
    }
    .hero-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 12px;
    }
    .hero p {
      font-size: 18px;
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 32px;
    }
    .badge-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }
    .badge {
      background: #f3f4f6;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }
    .link-grid {
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      padding: 0 24px;
    }
    .link-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .link-card:hover {
      border-color: var(--brand);
      box-shadow: 0 4px 16px rgba(91,127,238,0.12);
      text-decoration: none;
    }
    .link-card-icon { font-size: 28px; margin-bottom: 10px; }
    .link-card-title { font-weight: 600; font-size: 14px; }
    .link-card-desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">
    <div class="logo-icon"><img src="icon.png" alt="DictaFlow" style="width:100%;height:100%;object-fit:cover;border-radius:8px;"></div>
    <span class="logo-name">DictaFlow</span>
  </a>
  <nav>
    <a href="privacy.html">プライバシーポリシー</a>
    <a href="terms.html">利用規約</a>
    <a href="contact.html">お問い合わせ</a>
  </nav>
</header>

<div class="hero">
  <div class="hero-icon"><img src="icon.png" alt="DictaFlow"></div>
  <h1>DictaFlow</h1>
  <p>YouTube動画で英語ディクテーション。<br>聴いて、書いて、本物のリスニング力を身につける。</p>
  <div class="badge-row">
    <span class="badge">iOS 17+</span>
    <span class="badge">英語学習</span>
    <span class="badge">ディクテーション</span>
    <span class="badge">YouTube対応</span>
  </div>
</div>

<div class="link-grid">
  <a href="privacy.html" class="link-card">
    <div class="link-card-icon">🔒</div>
    <div class="link-card-title">プライバシーポリシー</div>
    <div class="link-card-desc">個人情報の取り扱い</div>
  </a>
  <a href="terms.html" class="link-card">
    <div class="link-card-icon">📄</div>
    <div class="link-card-title">利用規約</div>
    <div class="link-card-desc">サービス利用条件</div>
  </a>
  <a href="contact.html" class="link-card">
    <div class="link-card-icon">✉️</div>
    <div class="link-card-title">お問い合わせ</div>
    <div class="link-card-desc">サポート・ご連絡</div>
  </a>
</div>

<footer class="site-footer" style="margin-top: 80px;">
  <div class="footer-links">
    <a href="privacy.html">プライバシーポリシー</a>
    <a href="terms.html">利用規約</a>
    <a href="contact.html">お問い合わせ</a>
  </div>
  <p>&copy; 2026 DictaFlow. All rights reserved.</p>
</footer>

</body>
</html>
